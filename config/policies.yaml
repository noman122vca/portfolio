# Zero-Trust Security Policies & Environment Gating Rules
version: "1.0.0"
environment: "development"

gating_rules:
  secrets_management:
    allow_hardcoded_secrets: false
    enforce_env_placeholders: true
    env_file_location: ".env"
    env_example_location: ".env.example"

  network_boundaries:
    allowed_external_origins:
      - "https://hassan-mahmud.vercel.app"
      - "https://images.unsplash.com"
      - "https://i.ytimg.com"
      - "https://img.youtube.com"
      - "https://www.youtube.com"
      - "https://player.vimeo.com"
      - "https://drive.google.com"
      - "https://fonts.googleapis.com"
      - "https://fonts.gstatic.com"
      - "https://wa.me"
      - "https://www.facebook.com"
      - "https://www.instagram.com"
      - "https://www.linkedin.com"
      - "https://www.behance.net"
    allow_arbitrary_third_party_scripts: false

  client_side_security:
    allow_client_eval: false
    allow_client_raw_tokens: false
    enforce_secure_context: true
    content_security_policy:
      default_src: ["'self'"]
      script_src: ["'self'", "'unsafe-inline'"]
      style_src: ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
      font_src: ["'self'", "https://fonts.gstatic.com"]
      img_src: ["'self'", "data:", "https:"]
      media_src: ["'self'", "https:"]
      frame_src: ["https://www.youtube.com", "https://player.vimeo.com", "https://drive.google.com"]

  persistence_storage:
    primary_store: "localStorage"
    namespace: "hassan_portfolio_items_v18"
    language_namespace: "hassan_portfolio_lang"
    max_payload_mb: 5
