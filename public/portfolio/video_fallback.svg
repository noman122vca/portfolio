<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021019" />
      <stop offset="50%" stop-color="#052538" />
      <stop offset="100%" stop-color="#02090F" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#02090F" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Center Ambient Glow -->
  <circle cx="640" cy="340" r="360" fill="url(#glow)" />

  <!-- Outer Framing Glass Lines -->
  <rect x="50" y="50" width="1180" height="620" rx="28" fill="none" stroke="rgba(0, 229, 255, 0.3)" stroke-width="2.5" />
  <rect x="65" y="65" width="1150" height="590" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Top Badges -->
  <g transform="translate(100, 100)">
    <rect width="170" height="38" rx="19" fill="rgba(0, 229, 255, 0.15)" stroke="#00E5FF" stroke-width="2" />
    <text x="85" y="25" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00E5FF" text-anchor="middle" letter-spacing="2">4K CINEMA</text>
  </g>

  <g transform="translate(290, 100)">
    <rect width="190" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
    <text x="95" y="25" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">PREMIERE PRO</text>
  </g>

  <!-- Central Glowing Play Orb -->
  <g transform="translate(640, 320)">
    <!-- Rotating Dashed Orbit -->
    <circle r="80" fill="none" stroke="rgba(0, 229, 255, 0.5)" stroke-width="2.5" stroke-dasharray="10 8" />
    <circle r="66" fill="rgba(0, 229, 255, 0.12)" />
    <!-- Glass Sphere Core -->
    <circle r="56" fill="#071E2C" stroke="#00E5FF" stroke-width="3.5" filter="drop-shadow(0px 0px 20px rgba(0, 229, 255, 0.9))" />
    <!-- Play Triangle -->
    <polygon points="-12,-20 24,0 -12,20" fill="#00E5FF" />
  </g>

  <!-- Typography -->
  <text x="640" y="465" font-family="'Syne', 'Inter', system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    MD. EFTEKAR HOSSEN NOMAN
  </text>
  <text x="640" y="510" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="6">
    CINEMATIC VIDEO PRODUCTION &bull; MOTION GRAPHICS
  </text>

  <!-- Soundwave visualizer lines -->
  <g transform="translate(640, 560)">
    <rect x="-90" y="-12" width="6" height="24" rx="3" fill="#00E5FF" opacity="0.6" />
    <rect x="-70" y="-20" width="6" height="40" rx="3" fill="#00E5FF" opacity="0.8" />
    <rect x="-50" y="-8" width="6" height="16" rx="3" fill="#00E5FF" opacity="0.5" />
    <rect x="-30" y="-28" width="6" height="56" rx="3" fill="#00E5FF" opacity="0.9" />
    <rect x="-10" y="-36" width="6" height="72" rx="3" fill="#00E5FF" />
    <rect x="10" y="-36" width="6" height="72" rx="3" fill="#00E5FF" />
    <rect x="30" y="-28" width="6" height="56" rx="3" fill="#00E5FF" opacity="0.9" />
    <rect x="50" y="-8" width="6" height="16" rx="3" fill="#00E5FF" opacity="0.5" />
    <rect x="70" y="-20" width="6" height="40" rx="3" fill="#00E5FF" opacity="0.8" />
    <rect x="90" y="-12" width="6" height="24" rx="3" fill="#00E5FF" opacity="0.6" />
  </g>
</svg>
