<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hmCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A22" />
      <stop offset="100%" stop-color="#020B0E" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Neon Cyan Rim -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="4" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Monogram HM Logo for Hassan Mahmud -->
  <g filter="url(#cyanGlow)">
    <!-- H letter -->
    <path d="M 32 38 L 44 38 L 44 57 L 58 57 L 58 38 L 70 38 L 70 90 L 58 90 L 58 68 L 44 68 L 44 90 L 32 90 Z" fill="url(#hmCyanGrad)" />
    
    <!-- Dynamic Designer Accent / Creative Sparkle Dot -->
    <polygon points="64,28 67,34 73,37 67,40 64,46 61,40 55,37 61,34" fill="#00E5FF" />

    <!-- M letter stylized overlapping -->
    <path d="M 68 50 L 78 50 L 87 72 L 96 50 L 106 50 L 106 90 L 96 90 L 96 66 L 88 84 L 84 84 L 76 66 L 76 90 L 68 90 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Bottom Accent Dot in Cyan -->
  <circle cx="64" cy="100" r="3" fill="#00E5FF" />
</svg>
